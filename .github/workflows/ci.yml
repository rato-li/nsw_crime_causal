name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch first (small wheel, avoids CUDA bloat in CI)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: |
          pip install -U pip
          pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (no DB / no LLM required)
        run: pytest -q
